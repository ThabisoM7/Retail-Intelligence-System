services:
  - type: web
    name: ris-api
    env: docker
    plan: free
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ris-wholesale-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: THOLA_INTERNAL_KEY
        sync: false

  - type: psql
    name: ris-wholesale-db
    plan: free
    region: frankfurt
