services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ris_user:ris_password@db:5432/ris_wholesale
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - THOLA_INTERNAL_KEY=secret_dev_key
    depends_on:
      - db
    volumes:
      - .:/app

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=ris_user
      - POSTGRES_PASSWORD=ris_password
      - POSTGRES_DB=ris_wholesale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
